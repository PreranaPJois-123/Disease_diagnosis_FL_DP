# Full-scale defaults (docs/03-07). Smoke overrides: configs/smoke.yaml (--smoke). Frozen trial/sweep choices: configs/frozen.yaml.
data_root: "D:/mp"            # parent of CheXpert-v1.0-small/
cache_dir: cache
splits_dir: splits
results_dir: results/v2.1-final
seed: 42                      # split / partition seed (fixed); run seed comes from --seed
device: auto
subset_patients: null         # null = all train patients
val_frac: 0.10
local_val_frac: 0.10
blank_as_negative: true
uncertainty:                  # per-label policy for raw -1; anything not listed -> ignore
  Atelectasis: ones
  Edema: ones
  Cardiomegaly: zeros
  Consolidation: zeros
  Pleural Effusion: zeros
partition: {K: 5, alpha: 0.5, min_patients: 1500}
extract: {encoders: [mimic_ch, pc], batch_size: 64, num_workers: 4, chunk: 2048, amp: true}
features: {encoders: [nih], on_gpu: auto}          # encoders the head sees; on_gpu: auto | true | false (pinned CPU)
model: {head: film, d: 256, p_drop: 0.2, p_modality_drop: 0.1, loss: bce_pw, asl: {gamma_neg: 4.0, gamma_pos: 0.0, clip: 0.05}, ema: 0.0}
central: {epochs: 20, batch: 256, lr: 1.0e-3, wd: 1.0e-4, patience: 5, amp: true}
fl: {rounds: 30, local_steps: 50, batch: 256, lr: 1.0e-3, wd: 1.0e-4, server: fedavg, beta: 0.9, server_lr: 1.0,
     server_ema: 0.0, eval_every: 2, patience: 5, amp: true}
dp: {target_eps: 8.0, delta: 1.0e-5, clip: 1.0, max_images: 8, unit: patient, lr: 0.03, server: fedavgm, batch: 256,
     vmap_chunk: 256, accountant: prv}
eval: {bootstrap: 1000, bootstrap_val: 200, min_pos_test: 1, min_pos_val: 20, min_pos_group: 5}
sanity: {shuffle_tol: 0.07, l2_margin: 0.10, e0_min_auc: 0.70, l4_min_auc: 0.70, l4_gap: 0.05}
comm: {up: fp32, down: fp32, block: 1024, topk: 0.01}   # up: fp32|fp16|int8|topk (error feedback); down: fp32|fp16
fair: {method: none, attrs: [age, projection], wmin: 0.2, thr_attr: projection}   # method: none | F1 (reweight, w<=1) | F2 (group thresholds)
