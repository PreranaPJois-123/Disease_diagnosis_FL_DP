[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpmmfl"
version = "2.1.0"
description = "Differentially private multimodal federated learning for multi-label chest X-ray classification (CheXpert-small)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "torchvision", "torchxrayvision>=1.2", "opacus>=1.4",
  "numpy", "pandas", "pyarrow", "scikit-learn", "scikit-image", "pyyaml", "matplotlib", "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
dashboard = ["streamlit>=1.40", "plotly>=5.20", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 180
src = ["src", "scripts", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "E741", "E702", "E701", "E401", "E402", "B905"]
